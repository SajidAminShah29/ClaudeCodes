[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "resim"
version = "0.1.0"
description = "A reservoir simulator written for clarity: grids, properties, and flow solvers."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
resim = "resim.cli:main"

[tool.setuptools.packages.find]
include = ["resim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
