# Layered cross-section with a shale barrier and a pressure-driven
# steady-state waterflood between the left and right model sides.
# Units: m, mD, bar, cP, day, m³/day, kg/m³.

grid:
  type: cartesian
  dims: [50, 1, 10]
  dx: 20.0
  dy: 100.0
  dz: [2, 2, 3, 3, 1, 4, 4, 2, 2, 3]     # per layer
  tops: 2500.0

properties:
  PORO:   {source: layers, values: [0.22, 0.24, 0.20, 0.18, 0.05, 0.25, 0.26, 0.21, 0.19, 0.17]}
  PERMX:  {source: poro_perm, from: PORO, a: 15.0, b: -1.0}   # log10 k = a*phi + b
  PERMZ:  {expr: "0.1 * PERMX"}                               # kv/kh = 0.1
  SATNUM: {expr: "where(PORO < 0.1, 2, 1)"}

edits:
  # Layer 5 is a shale: kill vertical flow across it except in a window.
  - {op: equals, field: MULTZ, value: 0.0, box: [1, 50, 1, 1, 4, 5]}
  - {op: equals, field: MULTZ, value: 1.0, box: [24, 27, 1, 1, 4, 5]}

simulation:
  type: steady
  fluid: {viscosity: 0.5, density: 1020.0}
  boundary: {xmin: 280.0, xmax: 250.0}
